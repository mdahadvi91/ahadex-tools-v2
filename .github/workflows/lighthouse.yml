name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: https://ahadex.online

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url=http://localhost:4173/ \
            --collect.url=http://localhost:4173/tools/image-compressor \
            --collect.url=http://localhost:4173/about \
            --collect.numberOfRuns=1 \
            --collect.startServerCommand="npx vite preview --port 4173" \
            --collect.startServerReadyPattern="Local:" \
            --collect.settings.chromeFlags="--no-sandbox --disable-dev-shm-usage" \
            --assert.preset=lighthouse:recommended \
            --upload.target=temporary-public-storage || true

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          if-no-files-found: ignore
