name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: https://ahadex.online

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Generate sitemap
        run: npm run generate:sitemap
        env:
          VITE_SITE_URL: https://ahadex.online

      - name: Full validator suite
        run: npm run check:all
        env:
          VITE_SITE_URL: https://ahadex.online

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validator-reports
          path: reports/
          if-no-files-found: ignore
