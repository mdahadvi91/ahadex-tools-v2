name: AHADEX CI & Playwright Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cloudflare-equivalent-build:
    name: Cloudflare-Equivalent Build (Prettier, TS, ESLint, Coverage, SSG, Static Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run Cloudflare-equivalent npm run build (SKIP_E2E=1)
        run: npm run build
        env:
          VITE_SITE_URL: https://ahadex.online
          SKIP_E2E: '1'

      - name: Upload audit & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build-reports
          path: |
            reports/
            coverage/

  full-ci-with-playwright:
    name: Full Build + Playwright Chromium E2E Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Playwright Chromium browser & OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run full npm run build including Playwright E2E (REQUIRE_E2E=1)
        run: npm run build
        env:
          VITE_SITE_URL: https://ahadex.online
          REQUIRE_E2E: '1'

      - name: Upload full audit & Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ci-reports
          path: |
            reports/
            coverage/
            playwright-report/
